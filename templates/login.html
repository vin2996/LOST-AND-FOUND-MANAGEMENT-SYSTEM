<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Login - ZDSPGC Lost & Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#0A3D1F;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div class="card rounded-4 border-0 shadow-lg p-4" style="width:400px;border-radius:24px!important">
<h4 class="fw-bold text-center" style="color:#0A3D1F">🎓 ZDSPGC<br>Lost & Found</h4>
<p class="text-muted text-center" style="font-size:12px">Login with username or email</p>

{% with m=get_flashed_messages() %}
{% if m %}<div class="alert alert-warning rounded-pill py-2" style="font-size:13px">{{m[0]}}</div>{% endif %}
{% endwith %}

<form method="POST">
<input name="email" class="form-control rounded-pill mb-3 p-3" placeholder="Username or Email" required>
<input name="password" type="password" class="form-control rounded-pill mb-3 p-3" placeholder="Password" required>
<button class="btn btn-success w-100 rounded-pill fw-bold p-3">Login</button>
</form>

<div class="text-center mt-3">
<small style="font-size:13px">Don't have an account? <a href="/register" class="fw-bold text-success text-decoration-none">Register here</a></small>
</div>


</div>
</body>
</html>
