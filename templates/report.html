{% extends 'base.html' %}{% block content %}
<div class="card rounded-4 border-0 shadow-sm p-4" style="max-width:600px"><h4 class="fw-bold">Report Lost / Found Item</h4>
<form method="POST" enctype="multipart/form-data" class="mt-3">
<input name="name" class="form-control rounded-pill mb-3 p-3" placeholder="Item Name (e.g. Brown Wallet)" required>
<select name="category" class="form-control rounded-pill mb-3 p-3"><option>Wallet</option><option>ID Card</option><option>Keys</option><option>Bag</option><option>Phone</option><option>Others</option></select>
<textarea name="description" class="form-control rounded-4 mb-3 p-3" placeholder="Description" required></textarea>
<input name="location" class="form-control rounded-pill mb-3 p-3" placeholder="Location Found/Lost" required>
<select name="status" class="form-control rounded-pill mb-3 p-3"><option>Lost</option><option>Found</option></select>
<input type="file" name="image" class="form-control rounded-pill mb-3 p-3" accept="image/*"><button class="btn btn-warning w-100 rounded-pill p-3 fw-bold">Submit Report</button>
</form></div>{% endblock %}
