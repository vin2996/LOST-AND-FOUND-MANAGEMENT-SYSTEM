{% extends 'base.html' %}{% block content %}
<div class="card rounded-4 border-0 shadow-sm p-4" style="max-width:600px"><h4 class="fw-bold">Edit Item - Pwede mo change seed data boss</h4>
<form method="POST" enctype="multipart/form-data" class="mt-3">
<input name="name" value="{{item.name}}" class="form-control rounded-pill mb-3 p-3" required>
<input name="category" value="{{item.category}}" class="form-control rounded-pill mb-3 p-3">
<textarea name="description" class="form-control rounded-4 mb-3 p-3">{{item.description}}</textarea>
<input name="location" value="{{item.location}}" class="form-control rounded-pill mb-3 p-3">
<select name="status" class="form-control rounded-pill mb-3 p-3"><option {% if item.status=='Lost' %}selected{% endif %}>Lost</option><option {% if item.status=='Found' %}selected{% endif %}>Found</option><option {% if item.status=='Matched' %}selected{% endif %}>Matched</option><option {% if item.status=='Returned' %}selected{% endif %}>Returned</option></select>
<input type="file" name="image" class="form-control rounded-pill mb-3 p-3"><button class="btn btn-success w-100 rounded-pill p-3 fw-bold">Update</button>
</form></div>{% endblock %}
